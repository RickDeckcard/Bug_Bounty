<!DOCTYPE html>
<html lang="es">
<head>
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
	<meta http-equiv="Pragma" content="no-cache">
	<meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Práctica - Usuarios en Línea</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 20px; 
            background: #f4f7f9; 
        }
        h1 { text-align: center; color: #222; }
        .container { max-width: 1000px; margin: 0 auto; }
        .login-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 420px;
            margin: 0 auto 30px;
        }
        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
        }
        button:hover { background: #0055aa; }

        .usuarios {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { 
            padding: 12px; 
            border-bottom: 1px solid #eee; 
            text-align: left; 
        }
        th { background: #f0f0f0; }
        .success { color: #00aa00; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Login Práctica - Usuarios en Línea</h1>

        <div class="login-box">
            <form id="loginForm">
                <input type="text" id="username" placeholder="Usuario" required>
                <input type="password" id="password" placeholder="Contraseña" required>
                <button type="submit">Entrar</button>
            </form>
        </div>

        <div class="usuarios">
            <h2>👥 Usuarios Conectados (<span id="contador">0</span>)</h2>
            <table id="tabla">
                <thead>
                    <tr>
                        <th>Usuario</th>
                        <th>IP</th>
                        <th>Hora de Login</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        async function obtenerIP() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                return data.ip;
            } catch {
                return 'N/A';
            }
        }

        async function cargarUsuarios() {
            try {
                const res = await fetch('obtener_logs.php?v=' + Date.now());
                const usuarios = await res.json();
                
                document.getElementById('contador').textContent = usuarios.length;

                const tbody = document.querySelector('#tabla tbody');
                tbody.innerHTML = '';

                usuarios.forEach(u => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${u.usuario}</strong></td>
                        <td>${u.ip}</td>
                        <td>${u.hora}</td>
                        <td class="success">✅ En línea</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error("Error cargando usuarios", e);
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) return;

            const ip = await obtenerIP();
            const hora = new Date().toLocaleString('es-ES');

            await fetch('guardar_log.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    usuario: username,
                    ip: ip,
                    hora: hora
                })
            });

            alert(`✅ Login exitoso como: ${username}`);
            document.getElementById('loginForm').reset();
            cargarUsuarios();
        });

        // Actualizar lista cada 2 segundos
        setInterval(cargarUsuarios, 2000);
        cargarUsuarios(); // Carga inicial
    </script>
</body>
</html>
